name: Deploy to GCP (DEV)

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: SCP - Send files to GCP VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          source: "build/libs/*.jar,Dockerfile"
          target: "~/sefemedi-dev"

      - name: SSH - Docker Build & Run
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            cd ~/sefemedi-dev
            
            cp build/libs/*-SNAPSHOT.jar app.jar
            
            docker build -t spring-dev-image .
            
            docker stop spring-dev-container || true
            docker rm spring-dev-container || true
            
            docker run -d -p 8081:8080 --name spring-dev-container --restart always spring-dev-image