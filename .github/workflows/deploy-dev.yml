name: Deploy to GCP (DEV)

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: SCP - Send files to GCP VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          source: "build/libs/*.jar,Dockerfile"
          target: "~/sefemedi-dev"

      - name: SSH - Docker Build & Run
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            cd ~/sefemedi-dev
            
            cp build/libs/*-SNAPSHOT.jar app.jar
            
            docker build -t spring-dev-image .
            
            docker stop spring-dev-container || true
            docker rm spring-dev-container || true
            
            docker run -d -p 8081:8080 \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            -e DB_URL="${{ secrets.DB_URL }}" \
            -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --name spring-dev-container \
            --restart on-failure:5 \
            spring-dev-image

            
            docker stop prometheus || true
            docker rm prometheus || true
            
            docker run -d \
              --name prometheus \
              --restart on-failure:5 \
              -p 9090:9090 \
              -v $(pwd)/prometheus.yml:/etc/prometheus/prometheus.yml \
              prom/prometheus

            docker stop grafana || true
            docker rm grafana || true
            
            docker run -d \
              --name grafana \
              --restart on-failure:5 \
              -p 3000:3000 \
              -e "GF_SECURITY_ADMIN_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}" \
              grafana/grafana
            
            docker image prune -af