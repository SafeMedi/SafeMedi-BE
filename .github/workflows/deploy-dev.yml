name: Deploy to AWS EC2 (DEV)

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DEPLOY_DIR: /opt/safemedi/dev
      CONTAINER_NAME: safemedi-dev
      IMAGE_TAG: safemedi-dev:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        id: deployment-config
        env:
          AWS_EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          AWS_EC2_SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
          AWS_EC2_HOST_FINGERPRINT: ${{ secrets.AWS_EC2_HOST_FINGERPRINT }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FAMILY_INVITATION_BASE_URL: ${{ secrets.FAMILY_INVITATION_BASE_URL }}
          FAMILY_INVITATION_TOKEN_ENCRYPTION_KEY: ${{ secrets.FAMILY_INVITATION_TOKEN_ENCRYPTION_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          for NAME in \
            AWS_EC2_HOST \
            AWS_EC2_SSH_KEY \
            AWS_EC2_HOST_FINGERPRINT \
            DB_URL \
            DB_USERNAME \
            DB_PASSWORD \
            JWT_SECRET \
            FAMILY_INVITATION_BASE_URL \
            FAMILY_INVITATION_TOKEN_ENCRYPTION_KEY
          do
            if [ -z "${!NAME}" ]; then
              echo "::error::Required secret is not configured: $NAME"
              exit 1
            fi
          done

          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            echo "discord-enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "discord-enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew clean test bootJar

      - name: Prepare deployment artifact
        run: |
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)"
          test -n "$JAR_PATH"
          cp "$JAR_PATH" app.jar
          test -s app.jar

      - name: Upload artifact to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          fingerprint: ${{ secrets.AWS_EC2_HOST_FINGERPRINT }}
          source: "app.jar,Dockerfile,.dockerignore"
          target: "/opt/safemedi/dev"
          overwrite: true

      - name: Deploy DEV container
        uses: appleboy/ssh-action@v1.2.5
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FAMILY_INVITATION_BASE_URL: ${{ secrets.FAMILY_INVITATION_BASE_URL }}
          FAMILY_INVITATION_TOKEN_ENCRYPTION_KEY: ${{ secrets.FAMILY_INVITATION_TOKEN_ENCRYPTION_KEY }}
          FIREBASE_ENABLED: ${{ secrets.FIREBASE_ENABLED }}
          FCM_OUTBOX_BATCH_SIZE: ${{ secrets.FCM_OUTBOX_BATCH_SIZE }}
          FCM_OUTBOX_FIXED_DELAY_MS: ${{ secrets.FCM_OUTBOX_FIXED_DELAY_MS }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          fingerprint: ${{ secrets.AWS_EC2_HOST_FINGERPRINT }}
          envs: DB_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET,FAMILY_INVITATION_BASE_URL,FAMILY_INVITATION_TOKEN_ENCRYPTION_KEY,FIREBASE_ENABLED,FCM_OUTBOX_BATCH_SIZE,FCM_OUTBOX_FIXED_DELAY_MS,IMAGE_TAG,CONTAINER_NAME,DEPLOY_DIR
          command_timeout: 10m
          script: |
            set -eu

            cd "$DEPLOY_DIR"

            test -n "$DB_URL"
            test -n "$DB_USERNAME"
            test -n "$DB_PASSWORD"
            test -n "$JWT_SECRET"
            test -n "$FAMILY_INVITATION_BASE_URL"
            test -n "$FAMILY_INVITATION_TOKEN_ENCRYPTION_KEY"
            test -r "$DEPLOY_DIR/secrets/firebase-adminsdk.json"
            FIREBASE_ENABLED="${FIREBASE_ENABLED:-false}"

            PREVIOUS_IMAGE="$(docker inspect --format='{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)"
            docker build --tag "$IMAGE_TAG" .

            run_container() {
              TARGET_IMAGE="$1"
              docker run -d \
                --name "$CONTAINER_NAME" \
                --restart unless-stopped \
                --memory 640m \
                --cpus 1.0 \
                -p 127.0.0.1:8081:8080 \
                -e JAVA_TOOL_OPTIONS="-Xms128m -Xmx384m" \
                -e DB_URL="$DB_URL" \
                -e DB_USERNAME="$DB_USERNAME" \
                -e DB_PASSWORD="$DB_PASSWORD" \
                -e JWT_SECRET="$JWT_SECRET" \
                -e FAMILY_INVITATION_BASE_URL="$FAMILY_INVITATION_BASE_URL" \
                -e FAMILY_INVITATION_TOKEN_ENCRYPTION_KEY="$FAMILY_INVITATION_TOKEN_ENCRYPTION_KEY" \
                -e FIREBASE_ENABLED="$FIREBASE_ENABLED" \
                -e FIREBASE_CREDENTIALS_PATH="/run/secrets/firebase-adminsdk.json" \
                -e FCM_OUTBOX_BATCH_SIZE="${FCM_OUTBOX_BATCH_SIZE:-50}" \
                -e FCM_OUTBOX_FIXED_DELAY_MS="${FCM_OUTBOX_FIXED_DELAY_MS:-60000}" \
                -v "$DEPLOY_DIR/secrets/firebase-adminsdk.json:/run/secrets/firebase-adminsdk.json:ro" \
                "$TARGET_IMAGE"
            }

            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true

            if ! run_container "$IMAGE_TAG"; then
              if [ -n "$PREVIOUS_IMAGE" ]; then
                run_container "$PREVIOUS_IMAGE"
              fi
              exit 1
            fi

            HEALTHY=false
            for ATTEMPT in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:8081/actuator/health >/dev/null; then
                HEALTHY=true
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              docker logs --tail 150 "$CONTAINER_NAME" || true
              docker stop "$CONTAINER_NAME" 2>/dev/null || true
              docker rm "$CONTAINER_NAME" 2>/dev/null || true

              if [ -n "$PREVIOUS_IMAGE" ]; then
                run_container "$PREVIOUS_IMAGE"
              fi

              exit 1
            fi

            docker image prune -af --filter "until=168h"

      - name: Send deployment status to Discord
        if: always() && steps.deployment-config.outputs.discord-enabled == 'true'
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "AWS DEV deploy: ${{ job.status }}"
          description: "Commit: ${{ github.sha }}\nActor: ${{ github.actor }}"
          color: ${{ job.status == 'success' && '0x00FF00' || job.status == 'failure' && '0xFF0000' || '0xFFFF00' }}
