name: Verify AWS OIDC and SSM (DEV)

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEV_INSTANCE_ID: ${{ vars.AWS_DEV_INSTANCE_ID }}
      AWS_DEV_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}

    steps:
      - name: Validate AWS configuration
        shell: bash
        run: |
          set -eu

          for NAME in AWS_REGION AWS_DEV_INSTANCE_ID AWS_DEV_DEPLOY_ROLE_ARN; do
            if [ -z "${!NAME}" ]; then
              echo "::error::Required repository variable is not configured: $NAME"
              exit 1
            fi
          done

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: safemedi-dev-${{ github.run_id }}

      - name: Verify OIDC identity
        run: aws sts get-caller-identity

      - name: Verify SSM connection
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$AWS_DEV_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "SafeMedi DEV OIDC test ${GITHUB_SHA}" \
              --parameters 'commands=["set -eu","echo OIDC_SSM_OK","docker --version","test -r /opt/safemedi/dev/secrets/firebase-adminsdk.json"]' \
              --query 'Command.CommandId' \
              --output text
          )"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$AWS_DEV_INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$AWS_DEV_INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$AWS_DEV_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
